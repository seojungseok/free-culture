services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.nas
    image: free-culture:nas
    restart: unless-stopped
    env_file:
      - ./runtime/app.env
      - ./runtime/vercel-secrets.env
    environment:
      # Scheduled collectors own the provider allowance; page views use JSON.
      TOUR_RUNTIME_FETCH: "0"
      TOSS_SHARELINK_PUBLIC_FILE: "/app/runtime/sharelink/public/editorial.json"
      AFFILIATE_EVENTS_DIR: "/app/affiliate-events"
    ports:
      # LAN-only preview. Router port forwarding must remain disabled.
      - "192.168.0.115:3275:3000"
    volumes:
      - next_cache:/app/.next/cache
      - ./runtime/sharelink/public:/app/runtime/sharelink/public:ro
      - ./runtime/sharelink/events:/app/affiliate-events
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ./runtime/vercel-secrets.env
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m

volumes:
  next_cache:
