name: 쿠팡 계절 상품 수집 (수동·테스트)

# 수동 실행 전용 — GitHub Secrets(COUPANG_ACCESS_KEY/SECRET_KEY) 동작 확인 및
# 즉시 상품 새로고침용. 정기 자동 수집은 daily.yml이 담당(중복 스케줄 방지).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data # daily.yml과 같은 그룹 → 서로 충돌하지 않게
  cancel-in-progress: false

jobs:
  coupang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치
        run: npm ci

      - name: 계절별 쿠팡 상품 수집
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectCoupang.mjs

      - name: 문화행사 쿠팡 상품 수집
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectEventCoupang.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coupang.json data/eventCoupang.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 쿠팡 상품 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i…"; sleep 5
            done
          fi
