name: 일일 데이터·글 (통합, 1일 1배포)

# 기존 collect·tour-backfill·camping-images·articles 를 하나로 통합.
#  목적: 데이터 커밋을 하루 1회로 묶어 Vercel 재배포(=ISR 캐시 초기화) 횟수를 줄인다.
#  → 재배포마다 크롤러가 상세페이지를 재생성하며 ISR Writes가 늘어나므로, 배포 빈도가 핵심 절감 레버.
#  각 수집 스텝은 continue-on-error 로 독립 → 하나 실패해도 나머지 데이터는 그대로 커밋.
# Pro 전환(2026-07-29) — 하루 1배포 스케줄 복구. ISR 캐시 초기화는 하루 1회로만.
on:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 = KST 01:00 (하루 1회)
  workflow_dispatch:
    inputs:
      test_count:
        description: "글 테스트 생성 개수 (비우면 램프업대로)"
        required: false
        default: ""
      test_ids:
        description: "특정 contentId만 글 생성 (콤마구분)"
        required: false
        default: ""
      course_ids:
        description: "특정 여행코스만 생성 (콤마구분, 비우면 하루 10개)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치
        run: npm ci

      # ── 매일 수집은 "시간에 민감한 최신정보"만 (축제·문화행사). 나머지 정적 수집은 weekly.yml로 분리. ──
      - name: 축제 수집 (searchFestival2) — 날짜 있는 정보라 매일 최신화
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FEST_DAILY: "300"
        run: node scripts/collectFestivals.mjs

      - name: 문화행사 수집 (KorService2) — 신규·종료 반영 위해 매일 최신화
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COLLECT_DAYS: "90"
          COLLECT_MAX: "3000"
          COLLECT_CONCURRENCY: "10"
        run: node scripts/collect.mjs

      # ── 관광지 글 생성·발행 (재료는 이미 받아둔 캐시 사용, 신규 소개만 소량 on-demand) ──
      - name: 발행글 재점검 (needsRewrite)
        continue-on-error: true
        run: node scripts/auditArticles.mjs --write

      - name: 글 생성·검증·발행 (3중 안전망)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna" # 주 모델: 생성·검증 Luna 고정(80% 인하). 바꾸려면 이 값만 수정.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 보조: 독립 팩트체크(환각 교차검증)
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          FORCE_COUNT: ${{ github.event.inputs.test_count }}
          TEST_IDS: ${{ github.event.inputs.test_ids }}
        run: node scripts/generateArticles.mjs

      # ── 자동 코스 조합(좌표 기반, API 0) — 지역×테마×기간 코스 풀 갱신 ──
      - name: 자동 여행코스 조합 (buildCourses)
        continue-on-error: true
        run: node scripts/buildCourses.mjs

      # ── 여행코스 블로그 생성 (하루 10개, 계절·지방 우선). OpenAI 전용 ★제미나이 미사용★ ──
      # 재료: data/courses.json(공식, 수동 수집) + data/courses-auto.json(자동). 스팟 소개는 발행분만 보강.
      - name: 여행코스 글 생성·발행 (OpenAI만)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna" # 본문 생성은 Luna로 저렴하게
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 코스 "구성" 교차검증(중복·비현실 동선 차단)
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }} # 발행 코스 스팟 소개 보강용(한도 내)
          COURSE_IDS: ${{ github.event.inputs.course_ids }}
        run: node scripts/generateCourses.mjs

      # ── 계절별 캠핑용품 수집 (쿠팡 오픈 API) — 오늘 날짜로 봄/여름/가을/겨울 자동 판단 ──
      #    GitHub Secrets 에 COUPANG_ACCESS_KEY / COUPANG_SECRET_KEY 등록 필요.
      #    (없으면 이 스텝만 실패하고 나머지는 그대로 진행 — coupang.json은 직전 값 유지)
      - name: 캠핑 쿠팡 상품 수집 (collectCoupang, 4섹션)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectCoupang.mjs

      - name: 문화행사 쿠팡 상품 수집 (collectEventCoupang)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectEventCoupang.mjs

      # ── 변경분 한 번에 커밋 = 배포 1회 ──
      - name: 변경분 커밋 (통합, 1회)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/festivals.json data/place-articles.json \
                  data/courses.json data/courses-auto.json data/course-articles.json data/place-overviews.json \
                  data/coupang.json data/eventCoupang.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 일일 데이터·글 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push 재시도 $i…"; sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 새 글 페이지만 on-demand 갱신(재배포 후에도 즉시 반영 보장 + 목록 갱신)
      - name: 새 글 on-demand revalidate
        if: steps.commit.outputs.changed == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://mwohaji.kr
        run: node scripts/revalidatePublished.mjs
