name: 일일 데이터·글 (통합, 1일 1배포)

# 일반 글·시티투어·준비물·입장권과 혜택 갱신을 마지막 커밋 한 번에 반영한다.
# 비공개 작성 중간 기록은 저장하되 Vercel 빌드를 생략한다.
# 각 수집/발행 스텝은 실패를 격리해 준비된 다른 글은 계속 반영한다.
on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = KST 05:00 (하루 1회)
  workflow_dispatch:
    inputs:
      test_count:
        description: "글 테스트 생성 개수 (비우면 램프업대로)"
        required: false
        default: ""
      test_ids:
        description: "특정 contentId만 글 생성 (콤마구분)"
        required: false
        default: ""
      course_ids:
        description: "특정 여행코스만 생성 (콤마구분, 비우면 하루 10개)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Serialize with the ticket editor and manual publisher to protect durable history.
  group: site-content-publication
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      COUPANG_QUEUE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치
        run: npm ci

      - name: 발행 전 공개 글 기록 (API 호출 없음)
        run: node scripts/report-daily-publication.mjs snapshot

      # ── 매일 수집은 "시간에 민감한 최신정보"만 (축제·문화행사). 나머지 정적 수집은 weekly.yml로 분리. ──
      - name: 축제 수집 (searchFestival2) — 날짜 있는 정보라 매일 최신화
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FEST_DAILY: "300"
        run: node scripts/collectFestivals.mjs

      - name: 지역 축제 수집 — 부산·경주·울산·전남 공식 API 병합
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/collectRegionalFestivals.mjs

      - name: 축제 상세정보·사진 보강 (하루 20곳)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          FESTIVAL_ENRICH_DAILY: "20"
        run: node scripts/enrichFestivals.mjs

      - name: 문화행사 수집 (KorService2) — 신규·종료 반영 위해 매일 최신화
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COLLECT_DAYS: "90"
          COLLECT_MAX: "3000"
          COLLECT_CONCURRENCY: "10"
        run: node scripts/collect.mjs

      # ── 일반 자동글 30개: 가을나들이 10 + 여행코스 10 + 시티투어 10 ──
      - name: 발행글 재점검 (needsRewrite)
        continue-on-error: true
        run: node scripts/auditArticles.mjs --write

      - name: 글 생성·검증·발행 (3중 안전망)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna" # 주 모델: 생성·검증 Luna 고정(80% 인하). 바꾸려면 이 값만 수정.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 보조: 독립 팩트체크(환각 교차검증)
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          FORCE_COUNT: ${{ github.event.inputs.test_count }}
          TEST_IDS: ${{ github.event.inputs.test_ids }}
          # ── 비용 조절 손잡이 (여기 숫자만 바꾸면 됨) ──────────────────
          #  실측 단가(2026-08-24, gpt-5.6-luna $0.20/$1.20 + web_search $10/1k콜):
          #    · 검색 붙는 글 $0.0222  · 검색 없는 글 $0.0064  · 여행코스 $0.0037
          #  하루 = RESEARCH_MAX×$0.0222 + (DAILY−RESEARCH_MAX)×$0.0064 + 코스(최대 14건)×$0.0037
          #  가을 시즌값(10 / 10 / 코스재생성 4) = 가을 대표명소 10건 모두 조사+작성 → 약 $0.22/일 + 코스 최대 $0.052.
          #  web_search는 토큰과 별개로 호출 1회당 약 $0.01 → 검색 상한이 비용의 핵심.
          AUTUMN_ARTICLES: "on" # 가을나들이 후보를 대표 명소부터 우선 발행
          ARTICLE_DAILY: "10" # 가을나들이 글 하루 10개 추가
          ARTICLE_RESEARCH_MAX: "10" # 10개 모두 조사+AI 글작성 모드
        run: node scripts/generateArticles.mjs

      # ── 자동 코스 조합(좌표 기반, API 0) — 지역×테마×기간 코스 풀 갱신 ──
      - name: 자동 여행코스 조합 (buildCourses)
        continue-on-error: true
        run: node scripts/buildCourses.mjs

      # ── 반려동물 전국 기본정보 누적 수집(개발계정 한도 내) ──
      - name: 반려동물 동반여행 기본정보 수집
        continue-on-error: true
        env:
          PET_TOUR_API_KEY: ${{ secrets.PET_TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PET_DAILY: "800"
        run: node scripts/collectPetTravel.mjs

      - name: 반려동물 상세정보·사진 보강 (하루 10곳)
        continue-on-error: true
        env:
          PET_TOUR_API_KEY: ${{ secrets.PET_TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PET_ENRICH_DAILY: "10"
        run: node scripts/enrichPetTravel.mjs

      # ── 여행코스 블로그 생성 (하루 10개, 계절·지방 우선). OpenAI 전용 ★제미나이 미사용★ ──
      # 재료: data/courses.json(공식, 수동 수집) + data/courses-auto.json(자동). 스팟 소개는 발행분만 보강.
      - name: 여행코스 글 생성·발행 (OpenAI만)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna" # 본문 생성은 Luna로 저렴하게
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 코스 "구성" 교차검증(중복·비현실 동선 차단)
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }} # 발행 코스 스팟 소개 보강용(한도 내)
          COURSE_IDS: ${{ github.event.inputs.course_ids }}
          COURSE_DAILY: "10" # 일반 여행 글 합계30: 관광지10 + 코스10 + 시티투어10
          COURSE_REBUILD_MAX: "4" # 기존 글 보완은 신규 작성 수와 구분
        run: node scripts/generateCourses.mjs

      # ── 계절별 캠핑용품 수집 (쿠팡 오픈 API) — 오늘 날짜로 봄/여름/가을/겨울 자동 판단 ──
      #    GitHub Secrets 에 COUPANG_ACCESS_KEY / COUPANG_SECRET_KEY 등록 필요.
      #    (없으면 이 스텝만 실패하고 나머지는 그대로 진행 — coupang.json은 직전 값 유지)
      - name: 캠핑 쿠팡 상품 수집 (collectCoupang, 4섹션)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectCoupang.mjs

      # ── 캠핑글 "중간"에 넣을 생필품 링크(물·화장지·물티슈 등) ──
      #    쿠팡 API는 분당 6회 미만이라 한 번에 다 못 긁는다.
      #    → 키워드를 매 실행 4개씩 돌려가며(1회 5콜) 풀에 "누적"한다. 3회 실행이면 한 바퀴.
      - name: 캠핑 생필품 링크 수집 (collectCoupangEssentials, 로테이션 누적)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectCoupangEssentials.mjs

      - name: 문화행사 쿠팡 상품 수집 (collectEventCoupang)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectEventCoupang.mjs

      - name: 아이와 함께 쿠팡 상품 수집 (collectKidCoupang)
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/collectKidCoupang.mjs

      # ── 변경분 한 번에 커밋 = 배포 1회 ──
      - name: 시티투어 글 작성·검수 (Luna, 하루 최대 10개)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CITY_LIMIT: "10"
        run: node scripts/generateCityTours.mjs

      # 기존 글 작성 수·시간·순서는 유지. 검토된 주말 준비물만 별도 5개 quota.
      - name: 주말 준비물 예약 발행 (전체 합계 5개, 글별 실패 격리)
        continue-on-error: true
        run: node scripts/prep/publish-daily.mjs

      # Ticket generation stays in waug-editorial.yml; only reviewed due articles
      # are published here. Retries reload durable state and respect daily caps.
      - name: 입장권 발행 규칙 검사
        id: ticket_rules
        continue-on-error: true
        run: node --test scripts/waug/core.test.mjs scripts/waug/content-policy.test.mjs

      - name: 검수된 입장권 예약 발행 (통합 배포, 최대 3회 재시도)
        if: steps.ticket_rules.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/waug/manage.mjs run; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo '::warning::입장권 발행 실패. 일반 글은 계속 반영하고 다음 실행에서 재시도합니다.'
          exit 1

      - name: 기존 입장권 최저가보장 근거 갱신 (통합 배포)
        continue-on-error: true
        run: node scripts/waug/refresh-booking-guarantees.mjs

      - name: 변경분 커밋 (통합, 1회)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events-archive.json data/festivals.json data/chuseok.json data/place-articles.json data/place-research.json \
                  data/weekend-prep.json data/weekend-prep-daily-report.json \
                  data/courses.json data/courses-auto.json data/course-articles.json data/place-overviews.json \
                  data/coupang.json data/coupangEssentials.json data/eventCoupang.json data/kidCoupang.json data/pet-travel.json data/city-tour-articles.json \
                  data/waug/booking-guarantees.json data/waug/catalog.json data/waug/editorial.json data/waug/published.json data/waug/places.json data/waug/queue.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 일일 데이터·글 통합 발행 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # A merge conflict requires attention, never another publication.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                echo '::error::원격 변경과 충돌하여 통합 발행을 중단했습니다.'
                exit 1
              fi
              echo "push 재시도 $i…"; sleep 5
            done
            echo '::error::통합 발행 결과를 원격에 저장하지 못했습니다.'
            exit 1
          fi

      # JSON data is bundled by the new deployment. Invalidating the old live
      # deployment immediately after push cannot publish that new JSON.
      - name: 실제 신규 발행 수 확인
        if: always()
        run: node scripts/report-daily-publication.mjs
