name: 일일 최신정보·기존 글 품질 점검 (신규 발행 중지)

# 시간에 민감한 공공 정보는 갱신하되, AdSense 품질 개선 기간에는
# 새 글을 생성·재생성·발행하지 않는다. 기존 글의 품질 표식만 갱신한다.
on:
  schedule:
    - cron: "17 20 * * *" # KST 05:17 예정. 정각 혼잡을 피하되 실제 실행은 지연될 수 있다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize all information article publications.
  group: site-content-publication
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치
        run: npm ci

      - name: 수집 한도·저장정보 보존 검사 (실 API 호출 없음)
        run: |
          node --test scripts/lib/tourClient.test.mjs scripts/collectPlaceDetails.test.mjs scripts/collectPlaceImages.test.mjs scripts/enrichFestivals.test.mjs scripts/run-collector.test.mjs scripts/daily-api-budget.test.mjs
          node scripts/test-tour-detail-fallback.cjs
          node --test scripts/enrichCourseStops.test.mjs scripts/enrichCoursePlaces.test.mjs scripts/enrichCultureEvents.test.mjs
          node scripts/test-course-planning.cjs

      - name: 일일 공공 API 예산 (월요일은 주간 수집분 예약)
        id: api_budget
        run: node scripts/daily-api-budget.mjs

      - name: 발행 전 공개 글 기록 (API 호출 없음)
        run: node scripts/report-daily-publication.mjs snapshot

      # Dates are refreshed daily; existing place facts gain at most 20 detail
      # requests on Monday and 100 otherwise. No new AI article is generated or published.
      - name: 축제 수집 (searchFestival2) — 날짜 있는 정보라 매일 최신화
        id: festivals
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FEST_DAILY: "10"
        run: node scripts/collectFestivals.mjs

      - name: 지역 축제 수집 — 부산·경주·울산·전남 공식 API 병합
        id: regional
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/collectRegionalFestivals.mjs

      - name: 축제 상세정보·사진 보강 (하루 20곳)
        id: festival_details
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          FESTIVAL_ENRICH_DAILY: "20"
          FESTIVAL_ENRICH_BUDGET: "90"
        run: node scripts/run-collector.mjs scripts/enrichFestivals.mjs

      - name: 관광지·음식점 소개·공식 홈페이지 보강 (월요일 20회·그 외 100회)
        id: details
        continue-on-error: true
        timeout-minutes: 8
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PLACE_DETAIL_DAILY: ${{ steps.api_budget.outputs.details }}
        run: node scripts/run-collector.mjs scripts/collectPlaceDetails.mjs

      - name: 관광지·음식점 추가 사진 저장 (월요일 10회·그 외 30회)
        id: images
        continue-on-error: true
        timeout-minutes: 5
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PLACE_IMAGE_DAILY: ${{ steps.api_budget.outputs.images }}
        run: node scripts/run-collector.mjs scripts/collectPlaceImages.mjs

      - name: 문화행사 수집 (cultureinfo) — 신규·종료 반영 위해 매일 최신화
        id: events
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COLLECT_DAYS: "90"
          COLLECT_MAX: "200"
          COLLECT_CONCURRENCY: "2"
        run: node scripts/run-collector.mjs scripts/collect.mjs

      - name: 공식 여행코스 경유지 ID 대조 (30일 재점검)
        id: course_stops
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COURSE_STOP_DAILY: ${{ steps.api_budget.outputs.course_stops }}
        run: node scripts/run-collector.mjs scripts/enrichCourseStops.mjs

      - name: 코스에만 남아 있는 장소의 운영·예약 정보 저장
        id: course_places
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COURSE_PLACE_DAILY: ${{ steps.api_budget.outputs.course_places }}
        run: node scripts/run-collector.mjs scripts/enrichCoursePlaces.mjs

      - name: 문화행사 설명·공식 프로그램·참여 조건 보강
        id: culture_details
        continue-on-error: true
        timeout-minutes: 12
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          CULTURE_DETAIL_DAILY: "300"
          CULTURE_SOURCE_PAGES: "80"
          CULTURE_SOURCE_WORKERS: "2"
        run: node scripts/run-collector.mjs scripts/enrichCultureEvents.mjs

      - name: 기존 관광지 글 재점검 (재작성 후보 표시)
        continue-on-error: true
        run: node scripts/auditArticles.mjs --write

      - name: 기존 공개 글 통합 품질 점검 (사실·중복·최신성)
        continue-on-error: true
        run: node scripts/auditPublishedContent.mjs --write

      # ── 자동 코스 조합(좌표 기반, API 0) — 지역×테마×기간 코스 풀 갱신 ──
      - name: 자동 여행코스 조합 (buildCourses)
        continue-on-error: true
        run: node scripts/buildCourses.mjs

      # ── 반려동물 전국 기본정보 누적 수집(개발계정 한도 내) ──
      - name: 반려동물 동반여행 기본정보 수집
        id: pet
        continue-on-error: true
        env:
          PET_TOUR_API_KEY: ${{ secrets.PET_TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PET_DAILY: "800"
        run: node scripts/collectPetTravel.mjs

      - name: 반려동물 상세정보·사진 보강 (하루 10곳)
        id: pet_details
        continue-on-error: true
        env:
          PET_TOUR_API_KEY: ${{ secrets.PET_TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PET_ENRICH_DAILY: "10"
        run: node scripts/enrichPetTravel.mjs

      - name: 변경분 커밋 (통합, 1회)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events-archive.json data/festivals.json data/chuseok.json data/place-articles.json data/place-research.json \
                  data/courses.json data/courses-auto.json data/course-articles.json data/place-overviews.json data/place-details.json \
                  data/pet-travel.json data/city-tour-articles.json data/course-stop-checks.json data/course-place-details.json data/event-source-details.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 일일 정보 갱신·기존 글 품질 점검 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # A merge conflict requires attention, never another publication.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                echo '::error::원격 변경과 충돌하여 통합 발행을 중단했습니다.'
                exit 1
              fi
              echo "push 재시도 $i…"; sleep 5
            done
            echo '::error::통합 발행 결과를 원격에 저장하지 못했습니다.'
            exit 1
          fi

      # JSON data is bundled by the new deployment. Invalidating the old live
      # deployment immediately after push cannot publish that new JSON.
      - name: 실제 신규 발행 수 확인
        if: always()
        run: node scripts/report-daily-publication.mjs

      - name: 실제 API 수집 단계 결과 확인
        if: always()
        env:
          FESTIVALS: ${{ steps.festivals.outcome }}
          REGIONAL: ${{ steps.regional.outcome }}
          FESTIVAL_DETAILS: ${{ steps.festival_details.outcome }}
          DETAILS: ${{ steps.details.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          EVENTS: ${{ steps.events.outcome }}
          PET: ${{ steps.pet.outcome }}
          PET_DETAILS: ${{ steps.pet_details.outcome }}
          COURSE_STOPS: ${{ steps.course_stops.outcome }}
          COURSE_PLACES: ${{ steps.course_places.outcome }}
          CULTURE_DETAILS: ${{ steps.culture_details.outcome }}
          FESTIVAL_DETAIL_STATUS: ${{ steps.festival_details.outputs.collector_status }}
          PLACE_DETAIL_STATUS: ${{ steps.details.outputs.collector_status }}
          IMAGE_STATUS: ${{ steps.images.outputs.collector_status }}
          COURSE_STOP_STATUS: ${{ steps.course_stops.outputs.collector_status }}
          COURSE_PLACE_STATUS: ${{ steps.course_places.outputs.collector_status }}
          CULTURE_DETAIL_STATUS: ${{ steps.culture_details.outputs.collector_status }}
        run: |
          failed=0
          for name in FESTIVALS REGIONAL FESTIVAL_DETAILS DETAILS IMAGES EVENTS PET PET_DETAILS COURSE_STOPS COURSE_PLACES CULTURE_DETAILS; do
            outcome="${!name}"
            echo "$name: $outcome"
            if [ "$outcome" = "failure" ]; then failed=1; fi
          done
          for name in FESTIVAL_DETAIL_STATUS PLACE_DETAIL_STATUS IMAGE_STATUS COURSE_STOP_STATUS COURSE_PLACE_STATUS CULTURE_DETAIL_STATUS; do
            if [ "${!name}" = "deferred" ]; then
              echo "$name: 제공기관 한도로 연기 (기존 정보 보존)"
            fi
          done
          if [ "$failed" = "1" ]; then
            echo '::error::일부 API 수집이 실패했습니다. 성공한 데이터와 기존 URL은 보존했으며 실패 단계 로그를 확인해야 합니다.'
            exit 1
          fi
