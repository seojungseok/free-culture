name: Review preparation ingredient candidates
on:
  workflow_dispatch:
  push:
    branches: [codex/affiliate-prep-20261111]
    paths: [scripts/prep/review-ingredient-products.mjs, .github/workflows/prep-ingredient-review.yml]
permissions:
  contents: write
concurrency:
  group: site-content-publication
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/codex/affiliate-prep-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Single-item lookups through the existing shared gate
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_QUEUE_GITHUB_TOKEN: ${{ github.token }}
          PREP_INGREDIENT_REVIEW: '1'
        run: node scripts/prep/review-ingredient-products.mjs
      - name: Save candidates for review without publishing them
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prep-ingredient-candidates-20261111.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save unreviewed preparation ingredient candidates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
