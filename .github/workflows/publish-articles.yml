name: 관광지 글 발행 (수동)

# /admin/articles 에서 초안을 검토한 뒤, 이 워크플로우로 발행(published) 전환.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "발행할 초안 개수 (비우면 전체 초안 발행)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: articles-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 초안 → 발행 전환
        run: node scripts/publishDrafts.mjs "${{ github.event.inputs.count }}"

      - name: 변경분 커밋 (발행)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/place-articles.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 관광지 글 발행 ($(date -u +%Y-%m-%d))"
            git push
          fi
