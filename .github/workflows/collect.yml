name: 데이터 수집 (매일 새벽 5시 KST)

on:
  schedule:
    # UTC 20:00 = KST 05:00
    - cron: "0 20 * * *"
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm ci

      - name: 문화행사 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          COLLECT_DAYS: "60"
          COLLECT_MAX: "3000"
          COLLECT_CONCURRENCY: "10"
        run: node scripts/collect.mjs

      - name: 변경분 커밋 (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 문화행사 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
