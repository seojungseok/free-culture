name: 와그 서버 조사·작성·이미지·예약
on:
  schedule:
    - cron: '0 20,23 * * *' # KST 05:00 primary / 08:00 bounded continuation
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, scheduled]
        default: preflight
        description: 'preflight는 모델 조회·정적 검증만, 생성 및 발행 없음'
permissions:
  contents: write
concurrency:
  group: site-content-publication
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 서버 사진·브라우저·한글 준비
        run: |
          npm install --no-save --package-lock=false sharp playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: 유료 생성 없는 연결 검증
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --test scripts/waug/core.test.mjs scripts/waug/queue.test.mjs
          node scripts/waug/preflight.mjs
      - name: 제한된 콘텐츠 저장·이미지 서버 시작
        env:
          WAUG_SERVER_EXECUTION: '1'
          WAUG_IMAGE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WAUG_PREFLIGHT_ONLY: ${{ inputs.mode == 'preflight' && '1' || '0' }}
        run: |
          node scripts/waug/checkpoint-server.mjs > /tmp/waug-broker.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:47831/health && break || sleep 1; done
      - name: 서버 편집기 실행 또는 연결 점검
        timeout-minutes: 45
        uses: openai/codex-action@v1
        env:
          WAUG_SERVER_EXECUTION: '1'
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          effort: high
          safety-strategy: drop-sudo
          sandbox: workspace-write
          codex-args: '["-c", "sandbox_workspace_write.network_access=true", "-c", "web_search=\"live\""]'
          prompt-file: ${{ inputs.mode == 'preflight' && 'docs/waug-server-preflight.md' || 'docs/waug-server-worker.md' }}
          output-file: .cache/waug/server-result.md
      - name: 중단되어도 단계 저장
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'scheduled')
        env:
          WAUG_SERVER_EXECUTION: '1'
        run: node scripts/waug/checkpoint.mjs
      - name: 실행 검증 기록
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waug-server-${{ github.run_id }}
          path: |
            .cache/waug/preflight.json
            .cache/waug/server-result.md
            .cache/waug/*.png
          retention-days: 14
