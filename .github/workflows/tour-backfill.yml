name: 나들이 데이터 백필 (축제·음식점·방문팁·볼거리)

# 축제(searchFestival2)·음식점(39)·음식점 영업정보·방문 팁(detailIntro2)·볼거리(detailInfo2)를 점진 수집.
# fees.yml 은퇴로 일 1,000회를 이 워크플로우가 거의 독점 → 음식점·방문팁 진행 빨라짐.
# 순서: 축제(저비용) → 음식점 목록(거의 완료라 콜 미미) → 음식점 영업정보(수도권 우선) → 방문팁 → 볼거리.
# 스크립트가 한도 초과 시 진행분 저장 후 자동 중단(다음날 이어서). numbers는 캡.
# ⚠️ 스케줄 중단 — daily.yml(통합)로 이관(1일 1배포). 수동 실행만 유지.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tour-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 축제 수집 (searchFestival2) — 먼저(저비용, 진행/예정 갱신)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/collectFestivals.mjs

      - name: 음식점 수집 (areaBasedList2, 39) — 주변 맛집 섹션용(사진 우선, 목록은 사실상 완주)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          RESTO_DAILY: "100"
          RESTO_MAX: "6000"
        run: node scripts/collectRestaurants.mjs

      # 음식점 연락처·영업정보 채우기를 최우선으로 상향(300→500). 6,000곳 완주 20일→12일.
      - name: 음식점 영업정보 수집 (detailIntro2, 39) — 전화·영업시간·메뉴(수도권 우선)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          RIN_DAILY: "500"
        run: node scripts/collectRestaurantIntro.mjs

      # 1,000회/일 공유 한도 보호 → 관광지 intro/info는 잠시 축소(잔여 1만+, 급하지 않음)
      - name: 방문 팁 수집 (detailIntro2)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          INTRO_DAILY: "250"
        run: node scripts/collectIntro.mjs

      - name: 볼거리 수집 (detailInfo2)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          INFO_DAILY: "150"
        run: node scripts/collectInfo.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/place-intro.json data/place-info.json data/festivals.json data/restaurants.json data/restaurant-intro.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 방문팁·볼거리 백필 ($(date -u +%Y-%m-%d))"
            git push
          fi
