name: 여행코스 글 (전용, 빠름)

# 데이터 수집 없이 여행코스만 빠르게 생성·발행(2~3분). daily.yml과 별개 concurrency.
#  - buildCourses: 좌표로 코스 조합(API 0)
#  - generateCourses: OpenAI(gpt-5.6-luna)로 블로그화. ★제미나이 미사용★
on:
  workflow_dispatch:
    inputs:
      count:
        description: "생성 개수 (비우면 10개)"
        required: false
        default: ""
      course_ids:
        description: "특정 코스만 (콤마구분, 있으면 개수 무시)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: courses-generate
  cancel-in-progress: false

jobs:
  courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치
        run: npm ci

      - name: 자동 코스 조합 (buildCourses, API 0)
        continue-on-error: true
        run: node scripts/buildCourses.mjs

      - name: 여행코스 글 생성·발행 (OpenAI만)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-luna"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 코스 구성 교차검증
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }} # 발행분 스팟 소개 보강용
          FORCE_COUNT: ${{ github.event.inputs.count }}
          COURSE_IDS: ${{ github.event.inputs.course_ids }}
        run: node scripts/generateCourses.mjs

      - name: 변경분 커밋 (코스)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses-auto.json data/course-articles.json data/place-overviews.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 여행코스 글 발행 ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 새 글 on-demand revalidate
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://mwohaji.kr
        run: node scripts/revalidatePublished.mjs