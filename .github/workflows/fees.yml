name: 입장료 백필 (가볼만한 곳)

# 문화시설(14)·레포츠(28) 요금을 detailIntro2로 조회해 data/place-fees.json에 점진 캐시.
# ⚠️ 은퇴: collectIntro(tour-backfill)가 detailIntro2 전체(요금 포함)를 수집하는 상위집합이라
#    입장료도 intro 백필로 채워짐(lib/fees.getAdmission이 fees→intro 폴백). 일 1,000회를
#    intro·볼거리·음식점 수집에 몰아주기 위해 스케줄 중단. 필요 시 수동 실행만.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fees-backfill
  cancel-in-progress: false

jobs:
  fees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 입장료 백필 (하루 상한)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FEE_DAILY: "900"
        run: node scripts/collectFees.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/place-fees.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 입장료 백필 ($(date -u +%Y-%m-%d))"
            git push
          fi
