name: 겨울 여행코스 수동 점검·발행

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-content-publication
  cancel-in-progress: false

jobs:
  winter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: 겨울 발행 안전 검사
        run: node --test scripts/winter-course.test.mjs scripts/winter-public-display.test.mjs scripts/lib/winter-evidence.test.mjs scripts/winter-photo.test.mjs scripts/winter-publication.test.mjs
      - name: 공식 자료 확인
        id: evidence
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/refresh-winter-evidence.mjs
      - name: 검증된 겨울 코스 작성 및 발행
        id: publish
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WINTER_OPENAI_MODEL: gpt-6-luna
        run: node scripts/generate-winter-courses.mjs
      - name: 성공분과 비용 기록 보존
        if: always() && steps.publish.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/winter-courses.json data/winter-budget.json data/winter-place-verifications.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: 겨울 코스 확인 및 발행"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo '::error::원격 변경과 충돌하여 발행을 중단했습니다.'
              exit 1
            fi
            sleep 5
          done
          echo '::error::겨울 작업 결과를 원격에 저장하지 못했습니다.'
          exit 1
      - name: 결과 확인
        if: always()
        env:
          EVIDENCE: ${{ steps.evidence.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          echo "공식 자료 확인: $EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
          echo "겨울 발행: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVIDENCE" != success ] || [ "$PUBLISH" != success ]; then exit 1; fi
