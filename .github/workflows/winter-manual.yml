name: 겨울 당일치기 20개 자료·발행 검사
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: 검토된 당일치기 원고·사진·기존 URL 제거 검사
        run: node --test scripts/winter-daytrips.test.mjs scripts/winter-public-display.test.mjs scripts/winter-photo.test.mjs
