name: 관광지 글 자동 생성 (초안)

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = KST 10:00 매일 (시작일 이전엔 램프업이 0건 반환)
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      test_count:
        description: "시작일 전 테스트 생성 개수 (비우면 램프업대로)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: articles-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm ci

      - name: 초안 생성 (램프업만큼, 품질검사 통과분)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FORCE_COUNT: ${{ github.event.inputs.test_count }}
        run: node scripts/generateArticles.mjs

      - name: 변경분 커밋 (초안)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/place-articles.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 관광지 초안 자동 생성 ($(date -u +%Y-%m-%d))"
            git push
          fi
