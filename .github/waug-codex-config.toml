default_permissions = "waug-editor"
web_search = "live"

[features]
network_proxy = true

[permissions.waug-editor]
description = "Scheduled ticket research and content editing with ticket-source and site-only network access"
extends = ":workspace"

[permissions.waug-editor.filesystem.":workspace_roots"]
"scripts" = "read"
".github" = "read"
"docs" = "read"
"app" = "read"
"components" = "read"
"lib" = "read"
"data/waug/publication-policy.json" = "read"

[permissions.waug-editor.network]
enabled = true

